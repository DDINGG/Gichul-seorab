<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>서랍</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap">
<script>try{var t=localStorage.getItem("gj:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
/* 레이아웃: 한약장 서랍. 폴더는 이름표가 붙은 서랍, 세트는 서랍 속 목록, 학습 화면은 가운데 카드 한 장. 색은 청자빛 회색 바탕에 쪽빛 포인트, 알아요/몰라요만 의미색. */
:root{
  --bg:#EDF1EF; --surface:#F8FAF9; --surface-2:#E1E8E5; --fg:#16211D; --muted:#586861; --line:#C6D1CD;
  --accent:#24467A; --accent-fg:#FFFFFF; --accent-soft:#DAE4F3;
  --know:#1F7556; --know-soft:#D3EBE0; --dont:#B53D28; --dont-soft:#F6DCD5; --star:#A87200;
  --shadow:0 1px 2px rgba(18,38,32,.08),0 8px 24px rgba(18,38,32,.07);
  --display:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --body:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18211E; --surface-2:#222D29; --fg:#E4EDE9; --muted:#93A59E; --line:#2D3A35;
  --accent:#8FB2EA; --accent-fg:#0D1A2E; --accent-soft:#1D2C46;
  --know:#5FC7A0; --know-soft:#1A3A2F; --dont:#F28068; --dont-soft:#43231C; --star:#E3B341;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18211E; --surface-2:#222D29; --fg:#E4EDE9; --muted:#93A59E; --line:#2D3A35;
  --accent:#8FB2EA; --accent-fg:#0D1A2E; --accent-soft:#1D2C46;
  --know:#5FC7A0; --know-soft:#1A3A2F; --dont:#F28068; --dont-soft:#43231C; --star:#E3B341;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.3}
.wrap{max-width:980px;margin:0 auto}
.muted{color:var(--muted)}
.sp{flex:1}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

/* 상단 바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:19px}
.brand svg{width:26px;height:26px;color:var(--accent)}
.save{font-size:12px;color:var(--muted);padding:3px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.save.error{color:var(--dont);border-color:var(--dont)}
.save.local,.save.memory{color:var(--star);border-color:var(--star)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.know{background:var(--know-soft);border-color:var(--know);color:var(--know);font-weight:600}
.btn.dont{background:var(--dont-soft);border-color:var(--dont);color:var(--dont);font-weight:600}
.btn.danger{background:var(--dont);border-color:var(--dont);color:var(--bg)}
.btn.danger-ghost{color:var(--dont);border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:12px 20px;font-size:16px}
.ghost{background:none;border:0;padding:6px 8px;cursor:pointer;color:var(--muted);border-radius:8px}
.ghost:hover{color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 경로·제목 */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;color:var(--muted);font-size:13px;margin:4px 0 8px}
.crumbs button{background:none;border:0;padding:2px 4px;cursor:pointer;color:var(--muted);border-radius:6px}
.crumbs button:hover{color:var(--fg)}
.crumbs .cur{color:var(--fg);padding:2px 4px}
.titlerow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:4px 0 14px}
.titlerow h1{font-size:26px}
.chipd{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chipd.past{background:var(--surface-2);color:var(--muted)}
.toolrow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:14px 16px;border:1px solid var(--line);background:var(--surface);border-radius:12px;margin-bottom:14px}
.banner span{display:block;color:var(--muted);font-size:13px}

/* 서랍(폴더) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:18px}
.drawer{position:relative;display:flex;flex-direction:column;gap:9px;min-height:150px;padding:14px 14px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:inset 0 -4px 0 var(--surface-2);cursor:pointer}
.drawer:hover{border-color:var(--muted)}
.plate{border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:6px 28px 6px 10px;font-family:var(--display);font-weight:700;font-size:16px;overflow-wrap:anywhere}
.dmeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.knob{display:block;width:36px;height:8px;border-radius:5px;background:var(--muted);opacity:.45;margin:auto auto 0}
.gear{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:6px;background:none;cursor:pointer;color:var(--muted);line-height:1;font-size:18px}
.gear:hover{background:var(--surface-2);color:var(--fg)}
.mbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.mbar i{display:block;height:100%}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.mlegend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}

/* 세트 목록 */
.setlist{display:flex;flex-direction:column;gap:8px}
.setrow{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.setrow:hover{border-color:var(--muted)}
.srmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.srname{font-weight:600;overflow-wrap:anywhere}
.setrow .gear{position:static}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.empty .btn{margin-top:10px}
.hit{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.hit:hover{border-color:var(--muted)}
.hitset{display:block;font-size:12px;color:var(--muted)}
.hitq{display:block;overflow-wrap:anywhere}

/* 학습 패널 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 16px}
.panel h2{font-size:17px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.chip b{font-variant-numeric:tabular-nums;margin-left:3px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 18px;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:10px;font-size:13.5px;flex-wrap:wrap}
.opt .lbl{color:var(--muted);min-width:64px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg2 button{border:0;background:var(--bg);padding:4px 11px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg2 button:last-child{border-right:0}
.seg2 button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer}
.mode b{font-family:var(--display)}
.mode span{font-size:12.5px;color:var(--muted)}
.mode.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.mode.primary span{color:var(--accent-fg);opacity:.85}

/* 카드 목록 */
.listhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 10px}
.listhead h2{font-size:17px;margin-right:auto}
.crow{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.crow:hover{border-color:var(--muted)}
.idx{flex:none;width:28px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:2px}
.cbody{flex:1;min-width:0}
.cq{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ca{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:8px;background:var(--line)}
.dot.mastered{background:var(--know)}.dot.learning{background:var(--accent)}.dot.dont{background:var(--dont)}
.star{flex:none;border:0;background:none;cursor:pointer;font-size:18px;line-height:1;color:var(--line);padding:8px 10px;margin:-6px -4px}
.star.on{color:var(--star)}

/* 공통 학습 화면 */
.study{max-width:720px;margin:0 auto}
.study-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.count{font-variant-numeric:tabular-nums;font-weight:600}
.seg{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-bottom:6px}
.seg i{display:block;height:100%}
.tally{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tally .k{color:var(--know)}.tally .d{color:var(--dont)}

/* 플래시카드 */
.stage{margin:16px 0 14px}
.fc{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.fc:active{cursor:grabbing}
.face{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;min-height:min(34vh,260px);display:flex;flex-direction:column;gap:14px}
.reveal{border-top:1px solid var(--line);padding-top:14px}
.revbtn{align-self:flex-start;margin-top:auto}
.facelbl{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:10px}
.facebody{display:flex;flex-direction:column;gap:12px}
.qtext{font-family:var(--display);font-size:19px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.src{font-size:12px;color:var(--muted);margin-bottom:6px}
.hot{background:var(--dont-soft);color:var(--dont);border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:600;margin-left:2px}
.chlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.chlist li{display:flex;gap:8px;overflow-wrap:anywhere}
.cn{flex:none;font-family:var(--display);min-width:1.4em}
.ans{font-family:var(--display);font-size:20px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;display:flex;gap:8px}
.ans.sub{font-size:16px}
.exp{font-size:14.5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:12px}
.exp .lbl,.fbl span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.stamp{position:absolute;top:16px;z-index:3;padding:3px 12px;border:2px solid;border-radius:8px;font-weight:700;opacity:0;pointer-events:none;background:var(--surface)}
.stamp.know{right:16px;color:var(--know);transform:rotate(7deg)}
.stamp.dont{left:16px;color:var(--dont);transform:rotate(-7deg)}
.actions{position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:8px 0;background:var(--bg)}
.actions .btn{min-width:104px}
.kbd{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 0}

/* 퀴즈 */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);margin-top:12px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 14px;cursor:pointer;overflow-wrap:anywhere}
.choice:hover:not(:disabled){border-color:var(--muted)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--know);background:var(--know-soft)}
.choice.wrong{border-color:var(--dont);background:var(--dont-soft)}
.choice.dim{opacity:.55}
.choice:disabled{cursor:default;color:inherit}
.wrow{display:flex;gap:8px;margin-top:16px}
.winput{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--know-soft);border-color:var(--know)}
.fb.no{background:var(--dont-soft);border-color:var(--dont)}
.fbh{font-weight:700}
.fb.ok .fbh{color:var(--know)}.fb.no .fbh{color:var(--dont)}
.fbl{white-space:pre-wrap;overflow-wrap:anywhere}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.qdots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.qdot{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-size:12.5px;font-variant-numeric:tabular-nums}
.qdot.a{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qdot.cur{outline:2px solid var(--accent);outline-offset:1px}

/* 짝 맞추기 */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{min-height:92px;padding:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;text-align:left;font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.bad{border-color:var(--dont);background:var(--dont-soft)}
.tile.gone{visibility:hidden}

/* 결과 */
.result{text-align:center}
.rtitle{font-size:24px;margin:10px 0 14px}
.rnums{display:flex;justify-content:center;gap:40px;margin:16px 0}
.rnums b{display:block;font-family:var(--display);font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.rnums .k{color:var(--know)}.rnums .d{color:var(--dont)}
.rnums span{color:var(--muted);font-size:13px}
.ractions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px 0}
.cheer{width:100%;margin:0;color:var(--know)}
.rlist{text-align:left;margin-top:14px}
.rlist summary{cursor:pointer;color:var(--muted);text-align:center}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;text-align:left}
.wcard .qtext{font-size:16px}
.wcard .mine{color:var(--dont);margin-top:8px;font-size:14px}
.wcard .ans{font-size:15px;margin-top:6px;color:var(--know)}
.wcard .exp{margin-top:8px}

/* 모달 */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scrim{position:absolute;inset:0;background:rgba(8,16,13,.55)}
.sheet{position:relative;width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.sheet h3{font-size:19px;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13.5px}
.fld>span{color:var(--muted)}
.fld input,.fld textarea,.fld select,.chrow input[type=text],.chrow input:not([type]){border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.fld textarea{resize:vertical;min-height:60px}
.chrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chrow input[type=radio]{flex:none;width:18px;height:18px;padding:0;border:0;background:transparent;accent-color:var(--accent)}
.mfoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.err{color:var(--dont);font-size:13.5px;margin-top:6px}
.warn{color:var(--dont);font-size:13.5px}
details{margin:8px 0;font-size:13.5px}
summary{cursor:pointer;color:var(--muted)}
pre.sample{overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.outta{width:100%;min-height:240px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;max-width:calc(100vw - 32px)}
.foot{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:13px;align-items:center}

@media (max-width:560px){
  .titlerow h1{font-size:22px}
  .face{padding:16px;min-height:30vh}
  .qtext{font-size:17px}
  .rnums{gap:24px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .actions .btn{min-width:0;padding:12px 8px}
  .actions .btn.dont{order:1}.actions .btn.know{order:2}.actions .btn:not(.dont):not(.know){order:3}
}

html{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
.chrow input[type=checkbox]{flex:none;width:18px;height:18px;padding:0;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted,#888);margin:2px 0 8px}
.resume{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.resume b{flex:1 1 180px;min-width:0}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px 0}

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 864e5);
const bytes = s => new TextEncoder().encode(s).length;
const CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
const INTERVAL = [0, 1, 3, 7, 14, 30];
const norm = s => String(s || '').toLowerCase().replace(/[\s·,.;:()\[\]{}\-_\/~'"`]/g, '');
const clip = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const ansArr = c => Array.isArray(c.ans) ? c.ans : (c.ans != null ? [c.ans] : []);
const isMCQ = c => !!(c.ch && c.ch.length >= 2 && ansArr(c).length);
const plainAns = c => isMCQ(c) ? ansArr(c).map(i => c.ch[i]).join(' / ') : (c.a || '');
const ansText = c => isMCQ(c) ? ansArr(c).map(i => CIRC[i] + ' ' + c.ch[i]).join(' / ') : (c.a || '');
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const THEMES = { system: '◐ 시스템', light: '☀ 라이트', dark: '☾ 다크' };
const getTheme = () => { try { const t = localStorage.getItem('gj:theme'); return t === 'light' || t === 'dark' ? t : 'system'; } catch (e) { return 'system'; } };
function setTheme(t) { try { if (t === 'system') localStorage.removeItem('gj:theme'); else localStorage.setItem('gj:theme', t); } catch (e) {} if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
const MAX_SET_BYTES = 230000;

/* ---------- state ---------- */
const S = { nodes: [], sets: {}, prog: {}, log: {}, resume: {} };
const ui = { view: 'lib', folder: null, set: null, filter: 'all', shuffle: false, front: 'q', style: 'choice', examN: 20, query: '', cardQuery: '', modal: null, scope: null, dl: null };
let run = null, timer = null;

/* ---------- storage: db(계정별 비공개) → localStorage → 메모리 ---------- */
const lsGet = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } };
const lsSet = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const SAVE_TXT = { saved: '저장됨', saving: '저장 중…', error: '저장하지 못했어요', local: '이 브라우저에만 저장', memory: '임시 보기(닫으면 사라짐)' };
function setSave(cls) { const el = $('#save'); if (el) { el.className = 'save ' + cls; el.textContent = SAVE_TXT[cls]; } Store.cls = cls; }

const Store = {
  mode: 'memory', profile: null, mem: {}, chain: {}, timers: {}, pending: {}, inflight: 0, failed: false, cls: 'saved',
  async init(g) {
    this.sb = g.sb; this.uid = g.user.id; this.mode = 'db';
    ui.dl = { save: async ({ filename, data }) => { const a = document.createElement('a'); const u = URL.createObjectURL(new Blob([data], { type: 'text/plain;charset=utf-8' })); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); } };
    this.cls = 'saved';
  },
  key(kind, id) { return 'gj:' + kind + ':' + (id || ''); },
  async put(kind, id, data) {
    const { error } = await this.sb.from('user_docs').upsert({ user_id: this.uid, kind, id: id || '', data, updated_at: new Date().toISOString() }, { onConflict: 'user_id,kind,id' });
    if (error) throw error;
  },
  async del(kind, id) {
    const { error } = await this.sb.from('user_docs').delete().eq('user_id', this.uid).eq('kind', kind).eq('id', id || '');
    if (error) throw error;
  },
  async loadAll() {
    const { data, error } = await this.sb.from('user_docs').select('kind,id,data').eq('user_id', this.uid).range(0, 999);
    if (error) throw error;
    let prof = null; const sets = {}, prog = {};
    data.forEach(r => { if (r.kind === 'profile') prof = r.data; else if (r.kind === 'set') sets[r.id] = r.data; else if (r.kind === 'prog') prog[r.id] = r.data; });
    return prof ? { prof, sets, prog } : null;
  },
  queue(key, fn) {
    this.inflight++;
    const next = (this.chain[key] || Promise.resolve()).then(fn).then(() => { this.failed = false; }, e => { console.error(e); this.failed = true; }).then(() => { this.inflight--; this.refresh(); });
    this.chain[key] = next; return next;
  },
  later(key, fn, ms) { clearTimeout(this.timers[key]); this.pending[key] = fn; this.timers[key] = setTimeout(() => this.flushKey(key), ms || 500); this.refresh(); },
  flushKey(key) { clearTimeout(this.timers[key]); const fn = this.pending[key]; if (!fn) return; delete this.pending[key]; return this.queue(key, fn); },
  flushAll() { Object.keys(this.pending).forEach(k => this.flushKey(k)); },
  cancel(key) { clearTimeout(this.timers[key]); delete this.pending[key]; },
  refresh() { setSave(this.failed ? 'error' : (this.inflight > 0 || Object.keys(this.pending).length) ? 'saving' : (this.mode === 'db' ? 'saved' : this.mode)); }
};
const Pub = {
  async upsert(n, cards) { const { error } = await Store.sb.from('shared_sets').upsert({ id: n.pub, owner_id: Store.uid, name: n.name, cards, card_count: cards.length, updated_at: new Date().toISOString() }); if (error) throw error; },
  async remove(pid) { const { error } = await Store.sb.from('shared_sets').delete().eq('id', pid); if (error) throw error; },
  async list() { const { data, error } = await Store.sb.from('shared_sets').select('id,owner_id,owner_name,name,card_count,updated_at').order('updated_at', { ascending: false }).range(0, 499); if (error) throw error; return data; },
  sentF: {},
  async initF() { const { data } = await Store.sb.from('shared_folders').select('id').eq('owner_id', Store.uid); (data || []).forEach(r => { this.sentF[r.id] = ''; }); },
  async upsertF(id, w) { const { error } = await Store.sb.from('shared_folders').upsert({ id, owner_id: Store.uid, name: w.name, tree: w.tree, set_count: w.sc, card_count: w.cc, updated_at: new Date().toISOString() }); if (error) throw error; },
  async removeF(id) { const { error } = await Store.sb.from('shared_folders').delete().eq('id', id); if (error) throw error; },
  async listF() { const { data, error } = await Store.sb.from('shared_folders').select('*').order('updated_at', { ascending: false }).range(0, 199); if (error) throw error; return data; },
  async getMany(ids) { const { data, error } = await Store.sb.from('shared_sets').select('id,name,cards,owner_name').in('id', ids); if (error) throw error; return data; },
  async get(pid) { const { data, error } = await Store.sb.from('shared_sets').select('cards,name,owner_name').eq('id', pid).maybeSingle(); if (error) throw error; return data; }
};
function saveProfile() {
  ensureDefaultPublic(); syncFolders();
  Store.later('profile', () => {
    const lim = today() - 120; Object.keys(S.log).forEach(k => { if (+k < lim) delete S.log[k]; });
    return Store.put('profile', '', { v: 1, nodes: S.nodes, log: S.log, resume: S.resume });
  }, 500);
}
/* ---------- 플래시카드 이어하기 ---------- */
const rkey = sc => sc.type + ':' + (sc.id || '');
const rid = ref => ref.s + '|' + ref.c.id;
function saveResume() {
  const r = run, sc = ui.scope; if (!r || r.kind !== 'flash' || !sc) return;
  S.resume = S.resume || {};
  if (r.i >= r.refs.length) delete S.resume[rkey(sc)];
  else S.resume[rkey(sc)] = { t: Date.now(), f: ui.filter, round: r.round, front: r.front, i: r.i, order: r.refs.map(rid), res: r.hist.map(h => [h.ok ? 1 : 0, h.prev || 0]) };
  const ks = Object.keys(S.resume).sort((a, b) => S.resume[b].t - S.resume[a].t); ks.slice(10).forEach(k => delete S.resume[k]);
  Store.later('profile', () => Store.put('profile', '', { v: 1, nodes: S.nodes, log: S.log, resume: S.resume }), 800);
}
function clearResume(sc) { if (sc && S.resume && S.resume[rkey(sc)]) { delete S.resume[rkey(sc)]; saveProfile(); } }
function resumeFlash(scope) {
  const rs = S.resume && S.resume[rkey(scope)]; if (!rs) return false;
  const all = scopeRefs(scope), map = new Map(all.map(r => [rid(r), r]));
  const refs = [], know = [], dont = [], hist = [];
  rs.order.forEach((k, idx) => {
    const ref = map.get(k); if (!ref) return;
    refs.push(ref);
    if (idx < rs.i && rs.res[idx]) { const [ok, prev] = rs.res[idx]; (ok ? know : dont).push(ref); hist.push({ ref, ok: !!ok, prev: prev || null }); }
  });
  const i = hist.length; if (!refs.length || i >= refs.length) { clearResume(scope); return false; }
  ui.scope = scope; if (scope.type === 'set') ui.set = scope.id;
  run = { kind: 'flash', round: rs.round || 1, all: applyFilter(all, rs.f || 'all'), refs, i, know, dont, hist, flip: false, front: rs.front || 'q', busy: false };
  ui.view = 'flash'; go(); return true;
}
function resumeBox(scope) {
  const rs = S.resume && S.resume[rkey(scope)]; if (!rs) return '';
  return `<div class="resume"><b>플래시카드 이어하기 · ${rs.i} / ${rs.order.length}${rs.round > 1 ? ' · ' + rs.round + '회차' : ''}</b><button class="btn primary" data-a="resumeFlash" data-sc="${rkey(scope)}">이어서 하기</button><button class="btn" data-a="dropResume" data-sc="${rkey(scope)}">버리기</button></div>`;
}
function saveSet(id) { Store.later('set:' + id, () => S.sets[id] ? Store.put('set', id, { cards: S.sets[id].cards }) : null, 500); if (ensureDefaultPublic()) saveProfile(); syncPub(id); }
/* 기본은 공개. 비공개는 priv 표시로만 남긴다. 다른 사람에게서 저장한 사본(from)은 다시 공개하지 않는다. */
function ensureDefaultPublic() {
  let ch = false;
  S.nodes.forEach(n => {
    if (n.from || n.priv) return;
    if (n.type === 'folder') { if (!n.fid) { n.fid = uuid4(); ch = true; } }
    else if (!n.pub && S.sets[n.id] && setCards(n.id).length) { n.pub = uuid4(); ch = true; syncPub(n.id); }
  });
  return ch;
}
function setVis(id, pub) {
  subtreeIds(id).forEach(i => {
    const x = node(i); if (!x || x.from) return;
    if (pub) delete x.priv;
    else {
      x.priv = true;
      if (x.pub) { const pid = x.pub; delete x.pub; Store.cancel('pub:' + i); Store.queue('pubdel:' + pid, () => Pub.remove(pid)); }
      delete x.fid;
    }
  });
  ensureDefaultPublic();
}
const rootPub = n => n.type === 'folder' && n.fid && !n.priv && !path(n.id).slice(0, -1).some(a => a.fid && !a.priv);
function buildTree(f) {
  const out = []; let sc = 0, cc = 0;
  kids(f.id).forEach(k => {
    if (k.type === 'set') { if (k.pub && !k.priv) { const n = setCards(k.id).length; out.push({ t: 's', id: k.pub, name: k.name, n }); sc++; cc += n; } }
    else if (!k.priv) { const r = buildTree(k); if (r) { out.push(r.node); sc += r.sc; cc += r.cc; } }
  });
  return out.length ? { node: { t: 'f', name: f.name, kids: out }, sc, cc } : null;
}
function syncFolders() {
  Store.later('pubf', async () => {
    const want = {};
    S.nodes.filter(rootPub).forEach(f => { const r = buildTree(f); if (r) want[f.fid] = { name: f.name, tree: r.node, sc: r.sc, cc: r.cc }; });
    for (const id of Object.keys(Pub.sentF)) if (!want[id]) { await Pub.removeF(id); delete Pub.sentF[id]; }
    for (const [id, w] of Object.entries(want)) { const h = JSON.stringify(w); if (Pub.sentF[id] !== h) { await Pub.upsertF(id, w); Pub.sentF[id] = h; } }
  }, 1200);
}
function syncPub(id) { const n = node(id); if (!n || !n.pub || !S.sets[id]) return; Store.later('pub:' + id, () => Pub.upsert(n, S.sets[id].cards), 800); syncFolders(); }
function uuid4() { const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = b[6] & 15 | 64; b[8] = b[8] & 63 | 128; const h = [...b].map(x => x.toString(16).padStart(2, '0')).join(''); return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20); }
function saveProg(id) { Store.later('prog:' + id, () => { if (!S.sets[id]) return null; const p = P(id); return Store.put('prog', id, { c: p.c, star: p.star, best: p.best || null }); }, 700); }

/* ---------- 데이터 헬퍼 ---------- */
const P = id => { const p = S.prog[id] || (S.prog[id] = {}); p.c = p.c || {}; p.star = p.star || []; return p; };
const node = id => S.nodes.find(n => n.id === id);
const kids = pid => S.nodes.filter(n => (n.parent || null) === (pid || null)).sort((a, b) => (a.type === b.type ? 0 : a.type === 'folder' ? -1 : 1) || (a.order || 0) - (b.order || 0));
function path(id) { const p = []; let n = id ? node(id) : null; while (n) { p.unshift(n); n = n.parent ? node(n.parent) : null; } return p; }
function descSetIds(fid) { const out = []; kids(fid).forEach(k => { if (k.type === 'set') out.push(k.id); else out.push(...descSetIds(k.id)); }); return out; }
function subtreeIds(id) { const out = [id]; kids(id).forEach(k => out.push(...subtreeIds(k.id))); return out; }
const setCards = id => (S.sets[id] && S.sets[id].cards) || [];
const refOf = (s, c) => ({ s, c });
function scopeRefs(sc) {
  const ids = sc.type === 'set' ? [sc.id] : sc.type === 'folder' ? descSetIds(sc.id) : S.nodes.filter(n => n.type === 'set').map(n => n.id);
  return ids.flatMap(id => setCards(id).map(c => refOf(id, c)));
}
function cardStat(ref) { const r = P(ref.s).c[ref.c.id]; if (!r) return 'new'; if (r.b >= 3) return 'mastered'; if (r.b === 0) return 'dont'; return 'learning'; }
function isDue(ref) { const r = P(ref.s).c[ref.c.id]; return !!r && today() >= r.d + INTERVAL[r.b]; }
const isStar = ref => P(ref.s).star.includes(ref.c.id);
function stats(refs) { const o = { n: refs.length, new: 0, dont: 0, learning: 0, mastered: 0, due: 0, star: 0 }; refs.forEach(r => { o[cardStat(r)]++; if (isDue(r)) o.due++; if (isStar(r)) o.star++; }); return o; }
const setStats = id => stats(setCards(id).map(c => refOf(id, c)));
const folderStats = id => stats(descSetIds(id).flatMap(s => setCards(s).map(c => refOf(s, c))));
function applyFilter(refs, f) {
  if (f === 'dont') return refs.filter(r => cardStat(r) === 'dont');
  if (f === 'new') return refs.filter(r => cardStat(r) === 'new');
  if (f === 'due') return refs.filter(isDue);
  if (f === 'star') return refs.filter(isStar);
  if (f === 'hot') return refs.filter(r => /빈출/.test(r.c.src));
  return refs;
}
function record(ref, ok) {
  const p = P(ref.s), id = ref.c.id; const prev = p.c[id] ? { ...p.c[id] } : null;
  const r = p.c[id] || (p.c[id] = { b: 0, s: 0, r: 0, w: 0, d: 0 });
  r.s++; if (ok) { r.r++; r.b = Math.min(5, r.b + 1); } else { r.w++; r.b = 0; }
  const t = today(); r.d = t; S.log[t] = (S.log[t] || 0) + 1;
  saveProg(ref.s); saveProfile(); return prev;
}
function unrecord(ref, prev) {
  const p = P(ref.s), id = ref.c.id; if (prev) p.c[id] = prev; else delete p.c[id];
  const t = today(); if (S.log[t] > 0) S.log[t]--;
  saveProg(ref.s); saveProfile();
}
function streak() { let d = today(), n = 0; if (!(S.log[d] > 0)) d--; while (S.log[d] > 0) { n++; d--; } return n; }
function dday(n) { if (!n.exam) return null; const [y, m, d] = n.exam.split('-').map(Number); const t = new Date(y, m - 1, d); const now = new Date(); now.setHours(0, 0, 0, 0); return Math.round((t - now) / 864e5); }
function ddayChip(n, st) {
  const k = dday(n); if (k == null) return '';
  const label = k === 0 ? 'D-Day' : k > 0 ? 'D-' + k : 'D+' + (-k);
  let per = ''; const rem = st.n - st.mastered;
  if (k >= 0 && rem > 0) per = ' · 하루 ' + Math.ceil(rem / Math.max(1, k)) + '장';
  return `<span class="chipd ${k < 0 ? 'past' : ''}">${label}${per}</span>`;
}
function setCardsSafe(id, next) { if (bytes(JSON.stringify(next)) > MAX_SET_BYTES) return false; S.sets[id].cards = next; saveSet(id); return true; }

/* ---------- 가져오기 / 내보내기 ---------- */
function normCard(c) {
  if (!c || typeof c !== 'object') return null;
  const q = String(c.q ?? c.question ?? c.front ?? c.term ?? '').trim(); if (!q) return null;
  let ch = c.choices ?? c.ch ?? c.options; ch = Array.isArray(ch) ? ch.map(x => String(x).trim()).filter(Boolean) : [];
  let a = String(c.a ?? c.back ?? c.definition ?? '').trim(), ans = null;
  const A = c.answer ?? c.ans;
  if (ch.length >= 2) {
    const CI = '①②③④⑤⑥⑦⑧⑨⑩';
    if (typeof A === 'number') ans = [A - 1];
    else if (Array.isArray(A)) ans = A.map(x => typeof x === 'number' ? x - 1 : /^\d+$/.test(String(x).trim()) ? +String(x).trim() - 1 : ch.findIndex(y => y === String(x).trim()));
    else if (typeof A === 'string') { const t = A.trim(); const i = ch.findIndex(x => x === t); if (i >= 0) ans = [i]; else if (/^[\d\s,，、·&]+$/.test(t)) ans = t.split(/[^\d]+/).filter(Boolean).map(x => +x - 1); else if (t && [...t].every(k => CI.includes(k) || /[\s,，、·&]/.test(k))) ans = [...t].filter(k => CI.includes(k)).map(k => CI.indexOf(k)); else if (!a) a = t; }
    if (ans) { ans = [...new Set(ans)].filter(i => Number.isInteger(i) && i >= 0 && i < ch.length).sort((x, y) => x - y); ans = ans.length === 0 ? null : ans.length === 1 ? ans[0] : ans; }
  } else { ch = []; if (A != null && !a) a = String(A).trim(); }
  return { id: uid(), q, ch, ans, a, exp: String(c.exp ?? c.explanation ?? c.note ?? '').trim(), src: String(c.src ?? c.source ?? '').trim() };
}
function parseText(txt, fd) {
  const cs = fd ? fd.get('colsep') : 'tab', rs = fd ? fd.get('rowsep') : 'nl';
  const col = cs === 'comma' ? ',' : cs === 'semi' ? ';' : cs === 'custom' ? (fd.get('colcustom') || '\t') : '\t';
  const row = rs === 'semi' ? ';' : rs === 'custom' ? (fd.get('rowcustom') || '\n') : '\n';
  const lines = row === '\n' ? txt.split(/\r?\n/) : txt.split(row);
  const cards = []; let skipped = 0;
  lines.forEach(line => {
    if (!line.trim()) return;
    const parts = line.split(col); if (parts.length < 2) { skipped++; return; }
    const q = parts[0].trim(), a = parts[1].trim(); if (!q) { skipped++; return; }

  fc.addEventListener('pointerdown', e => { if (run.busy || e.target.closest('button')) return; sx = e.clientX; sy = e.clientY; dx = 0; drag = true; moved = false; fc.style.transition = 'none'; try { fc.setPointerCapture(e.pointerId); } catch (_) {} });

/* ---------- 퀴즈 · 모의시험 ---------- */
function makeItems(refs) {

  return refs.map(ref => {
    const c = ref.c;
    if (isMCQ(c)) return { ref, type: 'mcq', choices: c.ch.slice(), correct: ansArr(c) };
    if (c.a && ui.style === 'choice') {
      const dis = shuffle(pool.filter(t => norm(t) !== norm(c.a))).slice(0, 3);
      if (dis.length >= 3) { const ch = shuffle([c.a, ...dis]); return { ref, type: 'mcq', choices: ch, correct: [ch.indexOf(c.a)], gen: true }; }

function startQuiz(refs, exam, all) {

  async saveShared(fd) {
    const m = ui.modal, name = String(fd.get('name') || '').trim(); if (!name) return;
    let d; try { d = await Pub.get(m.pid); } catch (e) { toast('불러오지 못했어요'); return; }
    if (!d) { closeModal(); toast('이미 비공개로 바뀐 세트예요'); loadExplore(); return; }
    const parent = fd.get('parent') || null; ui.lastSaveFolder = parent || '';
    const n = { id: uid(), type: 'set', parent, name, order: Date.now() + S.nodes.length, from: m.pid, fromName: d.owner_name || m.owner || '' };
    S.nodes.push(n); S.sets[n.id] = { cards: clone(d.cards) }; saveSet(n.id); saveProfile(); closeModal(); render(); toast('내 서랍에 저장했어요');
  },
  node(fd) {
    const name = String(fd.get('name') || '').trim(); if (!name) return; const m = ui.modal;
    if (!m.id) {
      const exam = m.type === 'folder' ? fd.get('exam') : '';
      if (m.type === 'set') { const n = { id: uid(), type: 'set', parent: m.parent || null, name, order: Date.now() }; S.nodes.push(n); S.sets[n.id] = { cards: [] }; saveSet(n.id); saveProfile(); closeModal(); ui.set = n.id; ui.view = 'set'; ui.cardQuery = ''; go(); }
      else { addFolder(m.parent, name, exam); saveProfile(); closeModal(); render(); }
    } else {
      const n = node(m.id); n.name = name;
      if (n.type === 'folder') { const ex = fd.get('exam'); if (ex) n.exam = ex; else delete n.exam; }
      if (fd.get('parent') != null) n.parent = fd.get('parent') || null;
      const vis = fd.get('vis'); let msg = '';
      if (vis && !n.from) {
        const was = !n.priv, now = vis === 'public';
        if (was !== now) { setVis(n.id, now); msg = now ? (n.type === 'folder' ? '폴더 안의 세트를 모두 공개했어요' : '공개했어요. 스터디원이 볼 수 있어요') : (n.type === 'folder' ? '폴더 안의 세트를 모두 비공개로 바꿨어요' : '비공개로 바꿨어요'); }
      }
      if (n.pub) syncPub(n.id);
      saveProfile(); closeModal(); render(); if (msg) toast(msg);
    }
  },
  card(fd, f, e) {
    const m = ui.modal, q = String(fd.get('q') || '').trim(); if (!q) return;
    const raw = []; for (let i = 0; i < 10; i++) { const v = fd.get('c' + i); if (v == null) break; raw.push(String(v).trim()); }
    const sel = fd.getAll('ans').map(Number); const ch = []; let ans = [];
    raw.forEach((t, i) => { if (t) { if (sel.includes(i)) ans.push(ch.length); ch.push(t); } });
    ans = ans.length === 0 ? null : ans.length === 1 ? ans[0] : ans;
    const cards = setCards(m.set).slice();
    const card = { id: m.idx != null ? cards[m.idx].id : uid(), q, ch: ch.length >= 2 ? ch : [], ans: ch.length >= 2 ? ans : null, a: String(fd.get('a') || '').trim(), exp: String(fd.get('exp') || '').trim(), src: String(fd.get('src') || '').trim() };
    if (m.idx != null) cards[m.idx] = card; else cards.push(card);
    if (!setCardsSafe(m.set, cards)) { toast('세트가 너무 커서 더 저장할 수 없어요. 세트를 나눠 주세요.'); return; }
    const more = m.idx == null && e && e.submitter && e.submitter.value === '1';
    if (more) { ui.modal = { kind: 'card', set: m.set, idx: null }; renderModal(); toast('저장했어요'); } else closeModal();
    render();
  },
  import(fd) {
    const m = ui.modal, text = String(fd.get('text') || '');
    if (!text.trim()) { m.err = '내용을 붙여넣거나 파일을 선택하세요.'; renderModal(); return; }
    const res = parseAny(text, fd); if (res.err) { m.err = res.err; renderModal(); return; }
    if (res.backup) { restoreBackup(res.backup); closeModal(); render(); toast('백업을 복원했어요'); return; }
    if (m.target.type === 'set') {
      const add = res.cards || flatTree(res.items), next = setCards(m.target.id).concat(add);
      if (!setCardsSafe(m.target.id, next)) { m.err = '세트가 너무 커져요. 새 세트로 나눠서 가져오세요.'; renderModal(); return; }
      closeModal(); render(); toast('카드 ' + add.length + '장을 추가했어요'); return;
    }
    const parent = m.target.id || null, nm = String(fd.get('setname') || '').trim() || '가져온 세트 ' + new Date().toLocaleDateString('ko-KR');
    if (res.cards) addSetFromCards(parent, nm, res.cards); else addTree(res.items, parent, nm);
    saveProfile(); closeModal(); render(); toast('카드 ' + res.n + '장을 가져왔어요');
  }
};

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const fn = A[t.dataset.a]; if (fn) fn(t, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const fn = FORMS[f.dataset.form]; if (fn) fn(new FormData(f), f, e);
});
function updateImpCount() {
  const f = $('form[data-form="import"]'), out = $('#impcount'); if (!f || !out) return;
  const fd = new FormData(f), text = String(fd.get('text') || ''); if (!text.trim()) { out.textContent = ''; return; }
  const r = parseAny(text, fd);
  out.textContent = r.err ? r.err : r.backup ? `백업 파일 · 세트 ${r.n}개를 복원해요` : `카드 ${r.n}장을 인식했어요${r.skipped ? ` (구분자가 없는 ${r.skipped}줄은 건너뛰어요)` : ''}`;
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'xq') { ui.xq = t.value; const b = $('#xbody'); if (b && ui.xlist) b.innerHTML = xRows(); }
  else if (t.id === 'libq') { ui.query = t.value; $('#libbody').innerHTML = libBody(); }
  else if (t.id === 'cardq') { ui.cardQuery = t.value; $('#cardlist').innerHTML = cardRows(); }
  else if (t.dataset && t.dataset.in === 'wa' && run && run.kind === 'quiz') run.st[run.i].text = t.value;
  else if (t.closest && t.closest('form[data-form="import"]')) updateImpCount();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'impfile' && t.files && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { const ta = $('#imptext'); if (ta) { ta.value = String(rd.result || ''); updateImpCount(); } };
    rd.readAsText(t.files[0]);
  } else if (t.closest && t.closest('form[data-form="import"]')) updateImpCount();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.modal) { closeModal(); return; }
  if (ui.modal) return;
  const tag = e.target.tagName, typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-a]')) { e.preventDefault(); e.target.click(); return; }
  if (e.target.id === 'wa' && e.key === 'Enter') { e.preventDefault(); if (run.exam) { if (run.i < run.items.length - 1) A.nextQ(); } else A.submitText(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (ui.view === 'flash') {
    const onBtn = e.target.closest && e.target.closest('button');
    if ((e.key === ' ' || e.key === 'Enter') && !onBtn) { e.preventDefault(); flipCard(); }
    else if (e.key === 'ArrowRight') swipe(true);
    else if (e.key === 'ArrowLeft') swipe(false);
    else if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') undoFlash();
    else if (e.key === 's' || e.key === 'S') A.starCur();
  } else if (ui.view === 'quiz') {
    const r = run, it = r.items[r.i], s = r.st[r.i];
    if (it.type === 'mcq' && /^[1-9]$/.test(e.key) && +e.key <= it.choices.length) A.pick({ dataset: { i: String(+e.key - 1) } });
    else if (e.key === 'Enter' && !e.target.closest('button') && (r.exam || s.done)) A.nextQ();
    else if (r.exam && e.key === 'ArrowRight') A.nextQ();
    else if (r.exam && e.key === 'ArrowLeft') A.prevQ();
  }
});
window.addEventListener('pagehide', () => Store.flushAll());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flushAll(); });

/* ---------- 시작 ---------- */
async function main() {
  try {
    const g = await Gate.start();
    $('#app').innerHTML = '<div class="loading">서랍을 여는 중…</div>';
    await Store.init(g);
    const d = await Store.loadAll();
    if (d) {
      S.nodes = d.prof.nodes || []; S.log = d.prof.log || {}; S.resume = d.prof.resume || {}; S.sets = d.sets; S.prog = d.prog;
      S.nodes.filter(n => n.type === 'set').forEach(n => { if (!S.sets[n.id]) S.sets[n.id] = { cards: [] }; });
    } else seedData();
    try { await Pub.initF(); } catch (e) { console.warn(e); }
    if (ensureDefaultPublic()) saveProfile(); else syncFolders();
    Store.refresh(); render();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="loading">불러오지 못했어요.<br><span class="muted">${esc((e && e.message) || e)}</span><br><br><button class="btn" onclick="location.reload()">다시 시도</button></div>`;
  }
}
main();
})();
</script>
